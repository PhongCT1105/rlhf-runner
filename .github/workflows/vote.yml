name: Count Vote

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: votes
  cancel-in-progress: false

jobs:
  count:
    if: startsWith(github.event.issue.title, 'vote:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Record the vote
        id: vote
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python3 scripts/record_vote.py

      - name: Refresh the card
        if: steps.vote.outputs.result == 'counted'
        run: python3 scripts/rollout.py

      - name: Commit
        if: steps.vote.outputs.result == 'counted'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add votes.json dataset.jsonl replay.svg
          git diff --cached --quiet || { git commit -m "Vote from @${{ github.event.issue.user.login }}"; git push; }

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.vote.outputs.result }}" = "counted" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
              --body "✅ Vote counted — the card updates in a moment, and training runs Sunday 00:00 UTC. Thanks for teaching the robot!"
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
              --body "⚠️ Vote not counted — either there's no open question right now or the option wasn't recognized. Use the vote buttons in the README."
          fi
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
